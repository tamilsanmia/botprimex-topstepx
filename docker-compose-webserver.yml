---
# Backtesting stack for TopstepX futures: FreqUI (Freqtrade webserver mode) plus
# its own projectx-gateway for history downloads. Runs alongside the live stack in
# docker-compose.yml without sharing containers, guard state or tick files.
#
#   ./topstep build                        # builds the images (both stacks share them)
#   ./download-data.sh                     # history through the gateway
#   ./topstep backtest-ui                  # = docker compose -f docker-compose-webserver.yml up -d
#   open http://127.0.0.1:8095
#
# The web app is private by default: it listens on 127.0.0.1 only. For access from
# another machine use an SSH tunnel (ssh -L 8095:127.0.0.1:8095 <user>@<server>) or
# put a TLS reverse proxy in front of it. Only if you accept the exposure, set
# WEBSERVER_BIND=0.0.0.0 in .env. In every case the api_server password,
# jwt_secret_key and ws_token in config-futures-backtest.json must be real secrets:
# the web app refuses to start with empty or "change-me" values.
#
# The gateway here is data-only (GATEWAY_DATA_ONLY=1): it cannot place, change or
# cancel orders and runs no account, user hub or guard. It still logs in to
# ProjectX to read history and market metadata, so PROJECTX_USERNAME and
# PROJECTX_API_KEY in .env are required here too.
name: botprimex-backtest

services:
  projectx-gateway:
    build:
      context: ./projectx-gateway
    image: botprimex/projectx-gateway:latest
    restart: unless-stopped
    container_name: projectx-gateway-backtest
    env_file: .env
    environment:
      FREQTRADE_CONFIG: /freqtrade/user_data/config-futures-backtest.json
      # Separate state and tick directory from the live gateway.
      GATEWAY_DATA_DIR: /freqtrade/user_data/backtest-gateway
      GATEWAY_PORT: "8787"
      # Market data only: the order routes answer 403. Never remove this here.
      GATEWAY_DATA_ONLY: "1"
    volumes:
      # Least access: the config read-only, and only the gateway's own directory
      # writable (./topstep setup creates it; it must be owned by uid 1000).
      - "./user_data/config-futures-backtest.json:/freqtrade/user_data/config-futures-backtest.json:ro"
      - "./user_data/backtest-gateway:/freqtrade/user_data/backtest-gateway"
    networks:
      - backend
      - egress
    read_only: true
    tmpfs:
      - /tmp  # the tick recorder unpacks old days here
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  freqtrade-webserver:
    build:
      context: .
      dockerfile: docker/Dockerfile.freqtrade
    image: botprimex/freqtrade-projectx:latest
    restart: unless-stopped
    container_name: freqtrade-webserver
    depends_on:
      projectx-gateway:
        condition: service_healthy
    environment:
      GATEWAY_SECRET: ${GATEWAY_SECRET:?set GATEWAY_SECRET in .env}
    volumes:
      - "./user_data:/freqtrade/user_data"
      # Strategies live outside user_data, in ./strategies (read-only).
      - "./strategies:/freqtrade/user_data/strategies:ro"
    networks:
      - backend
      - egress
    # FreqUI / API on host port 8095 (8080 and 8090 are taken on this server).
    # Loopback by default; see the header for remote access.
    # See https://www.freqtrade.io/en/stable/rest-api/
    ports:
      - "${WEBSERVER_BIND:-127.0.0.1}:${WEBSERVER_PORT:-8095}:8080"
    # Writes only to user_data (mounted) and /tmp. Checked with `docker run` for
    # trade (dry-run), backtesting and list-exchanges. Freqtrade falls back to
    # `sudo chown` when it cannot create a directory under user_data; that is
    # blocked here, so user_data must already be owned by uid 1000 (./topstep setup).
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: >
      webserver
      --logfile /freqtrade/user_data/logs/freqtrade-webserver.log
      --config /freqtrade/user_data/config-futures-backtest.json

networks:
  backend:
    internal: true
  egress: {}
